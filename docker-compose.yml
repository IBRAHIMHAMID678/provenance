version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: insurance_lab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: insurance_lab
      POSTGRES_USER: lab_admin
      POSTGRES_PASSWORD: lab_secure_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_admin -d insurance_lab"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insurance_lab_backend
    restart: unless-stopped
    environment:
      ENV: production
      DATABASE_URL: postgresql://lab_admin:lab_secure_password@postgres:5432/insurance_lab
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_storage:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: insurance_lab_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  backend_storage:
